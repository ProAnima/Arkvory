name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      large_transfers:
        description: Run the 5 GiB HTTP transfer and restart test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check code and boundaries
        run: npm run check
      - name: Build and test domain and local storage
        run: npm test

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: depot_test
          POSTGRES_PASSWORD: depot_test
          POSTGRES_DB: depot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depot_test -d depot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DEPOT_TEST_DATABASE_URL: postgresql://depot_test:depot_test@127.0.0.1:5432/depot_test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and test PostgreSQL and HTTP
        run: npm run test:integration
      - name: Test 5 GiB transfer and process restart
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.large_transfers }}
        run: npm run test:large
      - name: Test 5 GiB multipart with process kill during upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.large_transfers }}
        run: node tests/large-transfer.mjs --multipart
