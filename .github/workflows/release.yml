name: Prepare stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (for example 1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: depot-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: depot_test
          POSTGRES_PASSWORD: depot_test
          POSTGRES_DB: depot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U depot_test -d depot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DEPOT_TEST_DATABASE_URL: postgresql://depot_test:depot_test@127.0.0.1:5432/depot_test
      DEPOT_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:browser:install
      - run: npm run gate -- release
      - name: Build and upload draft after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
      - name: Publish gate report
        if: ${{ always() }}
        run: node scripts/ci-report.mjs
