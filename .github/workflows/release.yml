name: Prepare stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (for example 1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arkvory-release
  cancel-in-progress: false
jobs:
  # Gates are not repeated here: their stands (KVM, kernel modules, disposable Windows services)
  # live in check.yml. Admission requires that workflow's complete merge gate, including both
  # 5 GiB transfers, for this exact commit; this workflow then only packages and accepts bytes.
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Require the complete merge gate for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-admission.mjs
  build:
    needs: admission
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARKVORY_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package once for the admitted commit
        run: npm run release:package -- "$ARKVORY_RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: artifacts/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  acceptance:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-2025
    env:
      ARKVORY_RELEASE_ARTIFACT: ${{ github.workspace }}/candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: candidate
      - run: npm ci --ignore-scripts
      - run: npm run gate -- deployment deployment-services
      - if: runner.os == 'Linux'
        run: npm run gate -- deployment-containers
      - name: Publish gate report
        if: ${{ always() }}
        run: node scripts/ci-report.mjs
  native:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      ARKVORY_RELEASE_ARTIFACT: ${{ github.workspace }}/candidate
      ARKVORY_NATIVE_ARTIFACT: ${{ github.workspace }}/native-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: candidate
      - run: npm ci --ignore-scripts
      - name: Cache verified native dependency archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/native-downloads
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-dependencies.mjs') }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y rpm postgresql
      - run: npm run gate -- native-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.os }}
          path: native-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish gate report
        if: ${{ always() }}
        run: node scripts/ci-report.mjs
  publish:
    needs:
      - admission
      - build
      - acceptance
      - native
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      ARKVORY_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: artifacts/${{ inputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts/${{ inputs.version }}
      - name: Verify and publish the tested bytes as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
