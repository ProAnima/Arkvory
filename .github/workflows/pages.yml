name: Documentation site

# The wiki (wiki/) on GitHub Pages: https://proanima.github.io/Arkvory/. Built from main only;
# the same build is the `docs` gate of check.yml, so a change that breaks it never reaches main.
# Publishing is the owner's decision: it runs once Pages is enabled for the repository (Settings,
# Pages, source GitHub Actions) and the repository variable ARKVORY_PAGES is `true`. Until then
# main is not marked red for a site that is not meant to exist yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkvory-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    if: github.ref == 'refs/heads/main' && vars.ARKVORY_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate -- docs
      - name: Publish gate report to logs and job summary
        if: ${{ always() }}
        run: node scripts/ci-report.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wiki/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ARKVORY_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job may write the site; it runs no repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
