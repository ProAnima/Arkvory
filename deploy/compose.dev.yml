name: arkvory-dev
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: arkvory
      POSTGRES_DB: arkvory
      POSTGRES_PASSWORD: ${ARKVORY_POSTGRES_PASSWORD:?Run npm run init:local first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - arkvory-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkvory -d arkvory']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  arkvory-postgres:
