# Prometheus alerting rules for ProAnima Arkvory (`GET /health/metrics`).
# Load with `rule_files:` in prometheus.yml; the scrape job must be named "arkvory".
# Thresholds are starting points for a Standalone server: tune them to measured traffic.
groups:
  - name: arkvory
    rules:
      - alert: ArkvoryDown
        expr: up{job="arkvory"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Arkvory API is not answering metrics scrapes
          description: Check the arkvory-api service, its startup.failed log record and the TLS or proxy path.

      - alert: ArkvoryHighServerErrorRate
        expr: |
          sum(rate(arkvory_http_requests_total{status_class="5xx"}[10m]))
            / clamp_min(sum(rate(arkvory_http_requests_total[10m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of Arkvory responses are server errors
          description: Correlate requestId in http.access and in the failed-request log line, whose code is capacity_exceeded (disk or quota), unavailable (PostgreSQL or an interrupted operation) or internal; errorName, errno and sqlstate name the cause.

      - alert: ArkvorySlowMetadataRequests
        # Transfers of large files are excluded: their duration follows object size, not health.
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(arkvory_http_request_duration_seconds_bucket{route!~".*(content|parts).*"}[10m]))
          ) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: p99 latency of Arkvory catalog and control requests is above 2 s
          description: Check PostgreSQL load, completion backlog and admission queues.

      - alert: ArkvoryCompletionBacklog
        expr: arkvory_completion_oldest_queued_seconds > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An upload completion job has waited more than 10 minutes
          description: The worker may be stopped or failing; see completion.* and worker.unavailable records.

      - alert: ArkvoryTransferAdmissionRejections
        expr: sum by (direction) (rate(arkvory_transfer_admission_failures_total{reason!="cancelled"}[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Arkvory keeps rejecting or timing out {{ $labels.direction }} transfers
          description: Clients wait for capacity; review ARKVORY_MAX_UPLOADS/DOWNLOADS, queue limits and per-principal caps.

      - alert: ArkvoryDiagnosticsDropped
        expr: increase(arkvory_diagnostic_records_total{outcome="dropped"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Arkvory dropped log records under stdout backpressure
          description: The log collector is not keeping up; incident evidence may be missing.

      - alert: ArkvoryMetricsCollectionFailing
        expr: increase(arkvory_metrics_collection_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Database-backed Arkvory metrics could not be collected
          description: arkvory_completion_* values are omitted until PostgreSQL answers again.

      - alert: ArkvoryTlsCertificateExpiring
        expr: arkvory_tls_certificate_expiry_timestamp_seconds - time() < 14 * 86400
        labels:
          severity: warning
        annotations:
          summary: The built-in HTTPS certificate expires in less than 14 days
          description: Renew the files in ARKVORY_TLS_CERT_FILE/KEY_FILE; Arkvory reloads them without a restart.

      - alert: ArkvoryTlsCertificateExpired
        expr: arkvory_tls_certificate_expiry_timestamp_seconds - time() < 0
        labels:
          severity: critical
        annotations:
          summary: The built-in HTTPS certificate has expired
          description: Clients reject the connection; install a renewed certificate.

      - alert: ArkvoryBackupStale
        # Age counts from snapshot T of the newest completed point; the daily plan allows 26 h.
        expr: time() - arkvory_backup_last_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The newest Arkvory backup point is older than 26 hours
          description: Check arkvoryctl backup status and jobs, the backup agent service and its backup.request.failed records.

      - alert: ArkvoryBackupAgentOffline
        expr: |
          time() - arkvory_backup_agent_last_seen_timestamp_seconds > 120
            or arkvory_backup_warnings{code="agent_offline"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Arkvory backup agent has not sent a heartbeat for more than 2 minutes
          description: Start or restart the arkvory-backup agent service; scheduled and requested backups wait until it runs.

      - alert: ArkvoryBackupWarning
        # Stale and offline have their own alerts; the remaining critical codes are listed here.
        expr: max by (code) (arkvory_backup_warnings{code=~"vault_unavailable|verify_failed"}) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Arkvory backups report {{ $labels.code }}
          description: vault_unavailable - mount the vault volume of ARKVORY_BACKUP_VAULT for the agent and keep it writable; verify_failed - keep the vault unchanged and investigate the damaged point.

      - alert: ArkvoryMirrorStale
        # Mirrors and imports (ADR 0058): caught up with the source feed less than an hour ago.
        expr: time() - arkvory_mirror_last_sync_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Mirror {{ $labels.repository }} has not caught up with its source for over an hour
          description: Check errorCode in GET /api/v1/repositories/{repository}/mirror, the worker mirror.step_failed records and the network path and key to the source. Downloads keep working from what is copied.

      - alert: ArkvoryMirrorFailing
        expr: max by (repository) (arkvory_mirror_failing) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Synchronization of mirror {{ $labels.repository }} keeps failing
          description: mirror_mismatch - keep the copy and investigate the artifact; mirror_source_changed - detach before changing the source; otherwise the source, its key or the local disk.

      - alert: ArkvoryRestartLoop
        # A new start time means a new process: repeated ownership loss, startup.failed or process.stalled.
        expr: changes(arkvory_process_start_time_seconds[30m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: The Arkvory API restarted at least three times in 30 minutes
          description: Read api.ownership_lost, startup.failed and process.stalled in the journal. A suspended host or a jumping clock ends the process by design; PostgreSQL failovers and network breaks do too.

      - alert: ArkvoryWebhookFailing
        expr: max by (subscription) (arkvory_webhook_failing) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Webhook {{ $labels.subscription }} keeps failing to reach its receiver
          description: Read errorCode in the worker webhook.step_failed records (blocked - the address is not allowed, tls - certificate, timeout or network - the path, http_4xx or http_5xx - the receiver, secret - the secret file). Events wait in the change feed and are delivered in order when the receiver answers again.

      - alert: ArkvoryReplicationDegraded
        # HA cluster (ADR 0072): writes are refused with replication_degraded while copies are short.
        expr: max(arkvory_replication_copies) < max(arkvory_replication_required_copies)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The HA cluster has fewer complete copies than writes need; writes are stopped
          description: Downloads keep working. Run arkvory cluster-status and pcs status on the active node; bring the peer back (writes resume after its resynchronization) or, only when waiting is worse than a single copy, record a decision with arkvory cluster-single-copy.

      - alert: ArkvorySingleCopyWrites
        expr: max(arkvory_replication_required_copies) == 1
        labels:
          severity: warning
        annotations:
          summary: An operator decision lets the HA cluster acknowledge writes with a single copy
          description: A loss of the active node now loses acknowledged writes. Return the peer and end the decision with arkvory cluster-single-copy --off; it also ends by itself at its time.

      - alert: ArkvoryReplicationCheckFailing
        expr: increase(arkvory_replication_check_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Arkvory cannot read the state of its copies and refuses writes
          description: Check the arkvory-replica service and its socket /run/arkvory/replica.sock on the active node (journalctl -u arkvory-replica); drbdsetup must answer within 1.5 seconds.
