name: arkvory-tests
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: arkvory_test
      POSTGRES_PASSWORD: arkvory_test
      POSTGRES_DB: arkvory_test
    ports:
      # Below the Windows dynamic range (49152-65535), where outbound connections of other
      # programs (VPN clients) and Hyper-V/WinNAT reservations take ports; outside 45329-45348,
      # which installed Arkvory databases use.
      - '127.0.0.1:45432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkvory_test -d arkvory_test']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - test-postgres:/var/lib/postgresql
volumes:
  test-postgres:
