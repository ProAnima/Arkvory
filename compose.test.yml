name: arkvory-tests
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: arkvory_test
      POSTGRES_PASSWORD: arkvory_test
      POSTGRES_DB: arkvory_test
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkvory_test -d arkvory_test']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - test-postgres:/var/lib/postgresql
volumes:
  test-postgres:
